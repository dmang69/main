<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shennell Desktop</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #2b1220, #0a0a0a 55%);
        color: #f6f1e8;
        font-family: "Segoe UI", "Helvetica Neue", sans-serif;
      }
      .panel {
        max-width: 760px;
        padding: 28px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 14px;
        background: rgba(0, 0, 0, 0.45);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 30px;
        font-weight: 500;
      }
      p {
        margin: 8px 0;
        line-height: 1.5;
        color: #d2cabd;
      }
      code {
        background: rgba(255, 255, 255, 0.08);
        padding: 2px 6px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>Shennell Desktop Wrapper Ready</h1>
      <p>
        This fallback page appears because no production URL is configured.
      </p>
      <p>
        Set <code>ELECTRON_START_URL</code> in <code>.env</code> or package a local web bundle.
      </p>
      <p id="runtime"></p>
    </div>
    <script>
      const runtime = document.getElementById("runtime");
      if (window.desktop) {
        runtime.textContent = `Electron ${window.desktop.versions.electron} on ${window.desktop.platform}`;
      }
    </script>
  </body>
</html>
